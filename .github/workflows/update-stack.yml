name: Update Stack Repo

on:
  repository_dispatch:
    types:
      - UpdateStackRepo

jobs:
  update_stack_repo:
    name: Update Stack Repo
    runs-on: ubuntu-latest
    env:
      STACK_PATH: ${{ github.event.client_payload.stackPath }}
      STACK_FILE: ${{ github.event.client_payload.stackFile }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v2
        with:
          ref: ${{ github.event.client_payload.branch }}

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.6.1/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Normalize Services List
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          echo "$PAYLOAD" > payload.json

          # Support both the legacy single-service "stackEntry" shape and the
          # newer batched "services" array shape in the same payload.
          jq 'if has("services") then .services else [.stackEntry] end' payload.json > services.json

          echo "Services to update:"
          cat services.json

      - name: Update Stack File
        run: |
          echo "Current $STACK_FILE:"
          cat "$STACK_FILE"

          count=$(jq 'length' services.json)
          for i in $(seq 0 $((count - 1))); do
            entry=$(jq -c ".[$i]" services.json)
            name=$(jq -r '.name' <<< "$entry")
            details=$(jq -c '.details' <<< "$entry")

            echo "Updating $STACK_PATH.$name in $STACK_FILE"
            yq eval -i "(.${STACK_PATH}.${name}) = ${details} | sortKeys(..)" "$STACK_FILE"
          done

          echo "Updated $STACK_FILE:"
          cat "$STACK_FILE"

      - name: Build Pull Request Metadata
        id: meta
        run: |
          names=$(jq -r '[.[].name] | join(", ")' services.json)
          branch_slug=$(jq -r '[.[].name] | join("_")' services.json | cut -c1-200)

          {
            echo "names=$names"
            echo "branch_slug=$branch_slug"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Promotion Of New Service Version(s)"
            echo
            echo "### Release Branch"
            echo
            echo "* **${{ github.event.client_payload.branch }}**"
            echo
            jq -r '.[] | "### \(.name)\n\n- Image: `\(.details.image.repository):\(.details.image.tag)`\n- Service VCS: [\(.details.vcs.sha // "n/a")](https://github.com/\(.details.vcs.repo.orgName // "")/\(.details.vcs.repo.repoName // "")/commit/\(.details.vcs.sha // ""))\n- Base Service VCS: [\(.baseVcs.sha // "n/a")](https://github.com/\(.baseVcs.repo.orgName // "")/\(.baseVcs.repo.repoName // "")/commit/\(.baseVcs.sha // ""))\n"' services.json
            echo "Event Payload"
            echo '```json'
            cat payload.json
            echo '```'
          } > body.md

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v3.8.2
        with:
          token: ${{ secrets.ASTROLABE_GITHUB_TOKEN }}
          commit-message: "chore(cd): update ${{ steps.meta.outputs.names }} version(s)"
          branch: stack-update_${{ steps.meta.outputs.branch_slug }}
          branch-suffix: timestamp
          title: "chore(cd): update ${{ steps.meta.outputs.names }} version(s)"
          labels: |
            autoMerge
            stackUpdate
          body-path: body.md
